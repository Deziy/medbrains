<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilim — oʻquv markazi</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mut:#5b6b85;--line:#d6deea;--ac:#2450e6;--on:#fff;--acs:#e3eaff;--ok:#16825d;--bad:#c23b3b;--gold:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1524;--card:#17203a;--ink:#e7ecf8;--mut:#92a0bd;--line:#2a3658;--ac:#7b9bff;--on:#0e1524;--acs:#22305c;--ok:#4cc79a;--bad:#ef7a7a;--gold:#e8b44f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1524;--card:#17203a;--ink:#e7ecf8;--mut:#92a0bd;--line:#2a3658;--ac:#7b9bff;--on:#0e1524;--acs:#22305c;--ok:#4cc79a;--bad:#ef7a7a;--gold:#e8b44f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{all:unset;cursor:pointer;font-weight:800;font-size:20px;letter-spacing:-.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tg{cursor:pointer;background:none;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:6px}
main{max-width:1000px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2.sec{font-size:22px;margin:44px 0 14px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 20px}
.crumb{cursor:pointer;background:none;border:0;color:var(--ac);font-weight:600;padding:0;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;background:linear-gradient(135deg,#1c3fb8,#0f7a8a);color:#fff;border-radius:16px;padding:36px;overflow:hidden}
.hero h1{font-size:36px;color:#fff}
.hero p{margin:10px 0 20px;opacity:.92}
.hero .go{cursor:pointer;background:#fff;color:#14213d;border:0;padding:12px 22px;border-radius:10px;font-weight:700;transition:transform .2s}
.hero .go:hover{transform:translateY(-2px)}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:34px;text-align:center}
.art span{background:rgba(255,255,255,.16);border-radius:12px;padding:6px;transition:transform .25s}
.art span:hover{transform:scale(1.12) rotate(-4deg)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:28px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ac)}
.stat small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{cursor:pointer;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;display:block;width:100%;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(20,33,61,.18);border-color:var(--ac)}
.pic{height:120px;display:grid;place-items:center;font-size:52px;font-weight:800;color:#fff;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 35) 70% 36%))}
.pic{padding:0}.pic img{padding:6px}.pic svg,.pic img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.card:hover .pic svg,.card:hover .pic img{transform:scale(1.12)}
.art svg{display:block;width:100%;height:70px}
.pic i{font-style:normal;transition:transform .3s;display:block}
.card:hover .pic svg,.pic img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.card:hover .pic svg,.card:hover .pic img{transform:scale(1.12)}
.art svg{display:block;width:100%;height:70px}
.pic i{transform:scale(1.25) rotate(-6deg)}
.cb{padding:14px 16px}
.cb b{display:block;font-size:17px}
.cb small{color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.f{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;transition:transform .25s}
.f:hover{transform:translateY(-4px)}
.f .e{font-size:30px}
.f b{display:block;margin:6px 0 2px}
.f span{color:var(--mut);font-size:15px}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;transition:transform .25s,border-color .25s}
.r:hover{transform:translateY(-4px);border-color:var(--ac)}
.r p{margin:0 0 12px}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:hsl(var(--h) 60% 45%)}
.who small{color:var(--mut);display:block}
.stars{color:var(--gold);letter-spacing:2px}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:40px}
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.row .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acs);display:grid;place-items:center;font-weight:800}
.row.paid .n{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--ok)}
.paid .tag{color:var(--gold)}
.fh{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.fh .pic{width:84px;height:84px;border-radius:16px;font-size:40px;flex:none}
.body{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.body p{max-width:68ch}
.q{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.q h3{margin:0 0 6px;font-size:17px}
.opt{cursor:pointer;display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;background:none;border:1px solid var(--line);border-radius:8px;transition:transform .15s,border-color .15s}
.opt:hover{border-color:var(--ac);transform:translateX(4px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.msg{font-weight:600;min-height:1.6em;margin-top:8px}
.btn{cursor:pointer;background:var(--ac);color:var(--on);border:0;padding:10px 18px;border-radius:8px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:380px;width:calc(100% - 32px);padding:24px}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog h2{margin:0 0 6px;font-size:20px}
.price{font-size:26px;font-weight:800;margin:10px 0}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

main>*:not(.rv){animation:up .45s backwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
.grid.in .card{animation:up .5s backwards;animation-delay:calc(var(--i)*70ms)}
.art svg{animation:float 4s ease-in-out infinite}
.art span:nth-child(even) svg{animation-delay:-2s}
.opt.ok{animation:pop .35s}.opt.bad{animation:shake .3s}
.pic.wide{height:170px;border-radius:14px;margin-bottom:16px}
.body{padding:28px}.body p{font-size:17px}
.key{background:var(--acs);border-radius:10px;padding:14px 18px;margin:18px 0}.key ul{margin:6px 0 0;padding-left:20px}
.q h2.sec{margin:0 0 6px;font-size:19px}.qq{margin-top:18px}
.res{display:none}.res.show{display:block;margin-top:22px;padding:18px;border:1px solid var(--ok);border-radius:12px;animation:pop .5s}
.res .btn{margin:12px 8px 0 0}.score{font-size:22px;font-weight:800}
.cta{margin-top:44px;text-align:center;background:linear-gradient(135deg,#1c3fb8,#0f7a8a);color:#fff;border-radius:16px;padding:30px 20px}
.cta h2{margin:0 0 6px}.cta p{margin:0;opacity:.92}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

</style>
</head>
<body>
<header>
  <button class="logo" id="home" type="button">Bilim</button>
  <button class="tg" id="theme" type="button">Mavzu</button>
</header>
<main id="main"></main>
<dialog id="pay" aria-labelledby="pt">
  <h2 id="pt">Bu dars pullik</h2>
  <p id="pd"></p>
  <div class="price" id="pp"></div>
  <div class="acts">
    <button class="btn" id="paybtn" type="button">Toʻlov qilish</button>
    <button class="btn ghost" id="close" type="button">Yopish</button>
  </div>
</dialog>
<script>
/* Har fanda 3 dars: 1- va 2-dars bepul (testli), 3-dars pullik. */
function F(t,i,h,p,d,a,b,c){return{t:t,i:i,h:h,price:p,d:d,D:[a,b,{t:c,P:[],K:[],T:[]}]}}
function L(t,P,K,T){return{t:t,P:P,K:K,T:T.map(function(x){return{q:x[0],o:x[1],a:x[2]}})}}
var FANLAR=[
F("Anatomiya","anatomiya",350,"59 000 soʻm","Inson tanasining tuzilishi",
 L("Suyaklar tizimi",["Skelet tananing tayanchi hisoblanadi. Voyaga yetgan odamda 206 ta suyak bor; chaqaloqda ular koʻproq, chunki keyinchalik baʼzilari qoʻshilib ketadi.","Suyaklar tayanch va harakat vazifasidan tashqari ichki aʼzolarni himoya qiladi, qon hujayralarini hosil qiladi hamda kalsiy va fosfor zaxirasini saqlaydi."],["Skeletda 206 ta suyak bor","Eng uzun suyak — son suyagi","Qizil ilik qon hujayralarini hosil qiladi"],
  [["Skeletda nechta suyak bor?",["106","206","306"],1],["Eng uzun suyak qaysi?",["Yelka suyagi","Son suyagi","Boldir suyagi"],1],["Qon hujayralari qayerda hosil boʻladi?",["Qizil ilikda","Jigarda","Oʻpkada"],0]]),
 L("Yurak tuzilishi",["Yurak — mushakli aʼzo boʻlib, koʻkrak qafasida chap tomonga biroz siljigan holda joylashgan. U toʻrt kameradan iborat: ikkita boʻlmacha va ikkita qorincha.","Oʻng yarmi qonni oʻpkaga, chap yarmi esa butun tanaga haydaydi. Qopqoqlar qonning orqaga qaytishiga yoʻl qoʻymaydi."],["4 kamera: 2 boʻlmacha, 2 qorincha","Chap qorincha devori eng qalin","Qopqoqlar qonni bir yoʻnalishda yuritadi"],
  [["Yurak nechta kamerali?",["2","3","4"],2],["Qonni butun tanaga qaysi qism haydaydi?",["Oʻng boʻlmacha","Chap qorincha","Oʻng qorincha"],1],["Qopqoqlarning vazifasi nima?",["Qonni sovitish","Oqimni bir yoʻnalishda tutish","Qonni tozalash"],1]]),"Nerv tizimi"),
F("Biokimyo","biokimyo",280,"69 000 soʻm","Tirik organizmdagi kimyoviy jarayonlar",
 L("Oqsillar",["Oqsillar aminokislotalar zanjiridan tuzilgan yirik molekulalardir. Tabiatda 20 ta asosiy aminokislota bor, ular turlicha tartibda birikib minglab oqsillarni hosil qiladi.","Oqsillar qurilish, himoya (antitanalar), tashish (gemoglobin) va katalitik (fermentlar) vazifalarni bajaradi."],["Monomeri — aminokislota","20 ta asosiy aminokislota","Fermentlarning koʻpchiligi oqsil"],
  [["Oqsil qaysi birliklardan tuziladi?",["Aminokislota","Glyukoza","Yogʻ kislotasi"],0],["Gemoglobin qanday vazifa bajaradi?",["Kislorod tashiydi","Energiya saqlaydi","Irsiyatni uzatadi"],0],["Asosiy aminokislotalar soni nechta?",["10","20","40"],1]]),
 L("Fermentlar",["Fermentlar — kimyoviy reaksiyalarni tezlashtiradigan biologik katalizatorlar. Ular reaksiyada sarflanmaydi, shuning uchun bir fermentdan koʻp marta foydalaniladi.","Har bir ferment faqat oʻziga mos moddaga taʼsir qiladi. Harorat va pH oʻzgarsa, ferment faolligi pasayadi."],["Ferment reaksiyani tezlatadi","Har bir ferment oʻz substratiga xos","Yuqori haroratda ferment buziladi"],
  [["Ferment nima?",["Biologik katalizator","Vitamin","Gormon"],0],["Ferment qaysi moddaga taʼsir qiladi?",["Istalgan moddaga","Faqat oʻziga mos substratga","Faqat suvga"],1],["Juda yuqori haroratda ferment nima boʻladi?",["Tezroq ishlaydi","Buziladi","Koʻpayadi"],1]]),"Uglevodlar almashinuvi"),
F("Fiziologiya","fiziologiya",200,"69 000 soʻm","Aʼzolar va tizimlar faoliyati",
 L("Nafas olish",["Nafas olishda havo burun, halqum, hiqildoq, traxeya va bronxlar orqali oʻpkaga boradi. Oʻpkaning eng mayda qismlari — alveolalardir.","Alveolalarda kislorod qonga oʻtadi, qondan esa karbonat angidrid chiqariladi. Nafas olish diafragma va qovurgʻalararo mushaklar yordamida amalga oshadi."],["Gaz almashinuvi alveolalarda sodir boʻladi","Diafragma — asosiy nafas mushagi","Yoʻl: burun → traxeya → bronxlar"],
  [["Gaz almashinuvi qayerda boʻladi?",["Alveolalarda","Jigarda","Oshqozonda"],0],["Asosiy nafas mushagi qaysi?",["Diafragma","Biseps","Trapetsiya"],0],["Qondan oʻpka orqali chiqariladigan gaz?",["Kislorod","Karbonat angidrid","Azot"],1]]),
 L("Qon aylanishi",["Qon aylanishi ikki doiradan iborat: katta doira butun tanani, kichik doira esa oʻpkani qon bilan taʼminlaydi.","Arteriyalar qonni yurakdan olib ketadi, venalar yurakka qaytaradi, kapillyarlarda esa moddalar almashinuvi sodir boʻladi."],["Ikki qon aylanish doirasi bor","Arteriya — yurakdan olib ketadi","Almashinuv kapillyarlarda boʻladi"],
  [["Qonni yurakdan nima olib ketadi?",["Venalar","Arteriyalar","Limfa"],1],["Qon aylanish doiralari soni nechta?",["1","2","3"],1],["Moddalar almashinuvi qayerda boʻladi?",["Kapillyarlarda","Aortada","Qopqoqlarda"],0]]),"Hazm tizimi"),
F("Patologiya","patologiya",160,"79 000 soʻm","Kasalliklarning rivojlanish mexanizmi",
 L("Yalligʻlanish",["Yalligʻlanish — toʻqima shikastlanishiga organizmning himoya javobidir. Klassik belgilari: qizarish, shish, ogʻriq va issiqlik; keyinchalik funksiya buziladi.","Jarayonda qon tomirlari kengayadi, leykotsitlar shikastlangan joyga oʻtadi va zararli omillarni yoʻq qiladi."],["4 ta klassik belgi bor","Leykotsitlar himoya qiladi","Oʻtkir va surunkali turlari mavjud"],
  [["Qaysi biri yalligʻlanish belgisi?",["Shish","Sovuqlik","Rangsizlanish"],0],["Himoyada qaysi hujayralar qatnashadi?",["Leykotsitlar","Neyronlar","Eritrotsitlar"],0],["Yalligʻlanish qanday turlarga boʻlinadi?",["Faqat oʻtkir","Oʻtkir va surunkali","Faqat surunkali"],1]]),
 L("Nekroz",["Nekroz — tirik organizmda hujayra va toʻqimalarning oʻlishi. Sabablari: qon taʼminotining buzilishi, jarohat, zahar yoki juda yuqori va past harorat.","Shakllari: quruq, nam va gangrena. Infarkt — qon taʼminoti toʻxtashidan hosil boʻladigan nekrozdir."],["Nekroz — toʻqima oʻlimi","Sababi koʻpincha qon taʼminoti buzilishi","Infarkt — nekroz turi"],
  [["Nekroz nima?",["Toʻqima oʻlimi","Yangi hujayra","Qon quyilishi"],0],["Infarkt nima?",["Qon taʼminoti buzilishidan nekroz","Yalligʻlanish","Oʻsma"],0],["Nekrozning sababi qaysi?",["Qon taʼminotining buzilishi","Yetarli uyqu","Vitamin"],0]]),"Oʻsmalar"),
F("Kimyo","kimyo",30,"49 000 soʻm","Moddalar va ularning oʻzgarishi",
 L("Davriy jadval",["Elementlar davriy jadvalini 1869-yilda D. I. Mendeleyev yaratgan. Elementlar atom massasi va xossalariga koʻra davr va guruhlarga joylashtirilgan.","Jadvalda 7 ta davr va 18 ta guruh bor. Bir guruhdagi elementlar oʻxshash xossalarga ega."],["Yaratuvchi: Mendeleyev, 1869","7 davr, 18 guruh","Bir guruh — oʻxshash xossa"],
  [["Davriy jadvalni kim yaratgan?",["Nyuton","Mendeleyev","Eynshteyn"],1],["Davrlar soni nechta?",["5","7","9"],1],["Bir guruhdagi elementlar qanday?",["Oʻxshash xossali","Mutlaqo har xil","Faqat gazlar"],0]]),
 L("Kislota va asoslar",["pH muhitning kislotali yoki ishqoriyligini koʻrsatadi. pH 7 — neytral, 7 dan kam — kislotali, 7 dan koʻp — ishqoriy muhit.","Kislotalar lakmusni qizartiradi, asoslar koʻkartiradi. Kislota va asos oʻzaro reaksiyaga kirishib tuz va suv hosil qiladi."],["pH 7 — neytral muhit","Kislota lakmusni qizartiradi","Neytrallanishdan tuz va suv hosil boʻladi"],
  [["pH 7 qanday muhit?",["Kislotali","Neytral","Ishqoriy"],1],["Kislota lakmusni qaysi rangga oʻtkazadi?",["Qizil","Koʻk","Yashil"],0],["Neytrallanish mahsuloti nima?",["Tuz va suv","Faqat gaz","Metall"],0]]),"Organik kimyo"),
F("Biologiya","biologiya",120,"49 000 soʻm","Tirik tabiat haqida fan",
 L("Hujayra",["Hujayra — tirik organizmning tuzilish va faoliyat birligi. Hayvon hujayrasi membrana, sitoplazma va yadrodan iborat.","Yadroda irsiy axborot (DNK) saqlanadi, mitoxondriyalar energiya hosil qiladi, ribosomalar esa oqsil sintez qiladi."],["Yadro — irsiy axborot markazi","Mitoxondriya — energiya","Ribosoma — oqsil sintezi"],
  [["Irsiy axborot qayerda saqlanadi?",["Yadroda","Membranada","Sitoplazmada"],0],["Energiyani qaysi organoid hosil qiladi?",["Mitoxondriya","Ribosoma","Yadrocha"],0],["Oqsil sintezi qayerda boradi?",["Ribosomada","Membranada","Vakuolada"],0]]),
 L("Fotosintez",["Fotosintez — oʻsimliklarning yorugʻlik energiyasi yordamida organik modda hosil qilish jarayoni. U xloroplastlarda, xlorofill ishtirokida boradi.","Karbonat angidrid va suvdan glyukoza hamda kislorod hosil boʻladi. Kislorod atmosferaga ajraladi."],["Joyi: xloroplast","Pigment: xlorofill","Mahsulot: glyukoza va kislorod"],
  [["Fotosintezda qaysi gaz ajraladi?",["Kislorod","Azot","Vodorod"],0],["Fotosintez pigmenti qaysi?",["Xlorofill","Melanin","Gemoglobin"],0],["Fotosintez qayerda boradi?",["Xloroplastda","Yadroda","Mitoxondriyada"],0]]),"Genetika"),
F("Ingliz tili","ingliz",210,"59 000 soʻm","Kundalik soʻzlar va gaplar",
 L("Salomlashish",["Ingliz tilida muloqot salomlashishdan boshlanadi. Hello va Hi — oddiy salom, Good morning, Good afternoon, Good evening esa kunning vaqtiga qarab aytiladi.","Tanishishda My name is… (Mening ismim…) va Nice to meet you (Tanishganimdan xursandman) iboralari ishlatiladi."],["Hello / Hi — salom","Good morning — xayrli tong","Nice to meet you — tanishganimdan xursandman"],
  [["“Xayrli tong” inglizcha qanday?",["Good night","Good morning","Thank you"],1],["“My name is…” nima degani?",["Mening ismim…","Men yoshman","Men oʻqiyman"],0],["“Nice to meet you” qachon aytiladi?",["Xayrlashganda","Tanishganda","Rahmat aytganda"],1]]),
 L("Sonlar",["1 dan 10 gacha sonlar: one, two, three, four, five, six, seven, eight, nine, ten.","Oʻnlik sonlar -ty bilan tugaydi: twenty, thirty, forty. 13 dan 19 gacha sonlar esa -teen bilan tugaydi: thirteen, fourteen, fifteen."],["One–ten: 1 dan 10 gacha","20 — twenty, 30 — thirty","13–19 oraligʻida -teen qoʻshimchasi"],
  [["“Three” nechta?",["2","3","4"],1],["20 inglizcha qanday?",["Twelve","Twenty","Two"],1],["“Fifteen” nechta?",["5","15","50"],1]]),"Zamonlar"),
